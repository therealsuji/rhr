name: rhr_cli
description: Dev-side CLI - tunnels a remote VM service to localhost and wraps flutter attach.
version: 0.1.0-beta.8
publish_to: none
environment:
  sdk: ^3.10.0
executables:
  rhr:
dependencies:
  rhr_bridge:
    path: ../bridge
  web_socket_channel: ^3.0.0
  qr: ^3.0.2
  crypto: ^3.0.0
  webrtc_dart: ^0.25.3

dependency_overrides:
  webrtc_dart:
    path: ../third_party/webrtc_dart

dev_dependencies:
  test: ^1.25.0

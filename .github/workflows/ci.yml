name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Apps commit pubspec.lock and CI enforces it; bridge is a library and
        # resolves fresh, like its consumers' lockfiles do.
        include:
          - package: bridge
            lockfile: false
          - package: cli
            lockfile: true
          - package: relay
            lockfile: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.10.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: matrix.package == 'cli'
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Test ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        env:
          ENFORCE_LOCKFILE: ${{ matrix.lockfile }}
        run: |
          if [ "$ENFORCE_LOCKFILE" = true ]; then
            dart pub get --enforce-lockfile
          else
            dart pub get
          fi
          dart analyze
          dart test --concurrency=1

  relay-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check

  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Analyze and test Player
        working-directory: player
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build and check Android alignment
        working-directory: player
        run: |
          flutter build apk --debug --target-platform android-arm64
          dart run tool/check_16kb.dart

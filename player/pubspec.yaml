name: rhr_player
description: Universal player for rhr remote hot reload — one install runs any project via DevFS sync.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Note: no rhr_bridge dep — the player's tunnel is the NATIVE
  # RhrSessionService (Dart-side bridges die on guest hot restart).

  # Native plugin superset. Only the native halves matter here: guest apps
  # bring their own Dart code via DevFS, but MethodChannels need these
  # compiled into the player binary. Versions are pinned to a known-good set.
  # Pin the generic player's native ABI surface. Caret upgrades can change the
  # MethodChannel/native implementation underneath a streamed Dart package.
  # The CLI applies the documented V1 compatibility range to these pins.
  device_info_plus: ^13.2.0
  firebase_core: 4.12.1
  flutter_blue_plus: 2.3.10
  flutter_secure_storage: ^10.3.1
  open_settings_plus: 0.5.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  shared_preferences: 2.5.5
  shared_preferences_android: 2.4.27
  sqflite: ^2.4.3
  url_launcher: ^6.3.2
  # Scan the dev's QR (relay + code) to connect — the Expo Go flow.
  mobile_scanner: 7.4.0
  image_picker: ^1.2.3
  permission_handler: ^13.0.0
  connectivity_plus: ^7.3.1
  webview_flutter: ^4.14.1
  video_player: ^2.13.0
  camera: ^0.12.0+2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

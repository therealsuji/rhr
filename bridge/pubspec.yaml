name: rhr_bridge
description: Device-side bridge - tunnels the local Dart VM Service to an rhr relay over an outbound WebSocket.
publish_to: none
environment:
  sdk: ^3.10.0
dependencies:
  web_socket_channel: ^3.0.0
  webrtc_dart: ^0.25.3

dependency_overrides:
  webrtc_dart:
    path: ../third_party/webrtc_dart

dev_dependencies:
  test: ^1.25.0
